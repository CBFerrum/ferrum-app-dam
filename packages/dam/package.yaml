package: dam
version: 0.1.1
label: Digital Assets
description: "Assets kept in Drive with their rights, approved by version, collections, and usage kept within the rights"
depends: [core, drive]

modules:
  - name: dam
    label: Digital Assets
    icon: hard-drive
    order: 61
    items: [MediaAsset, AssetUsage, AssetCollection, AssetShare]

roles:
  - name: Brand Manager
    description: Approves assets for use, sends them back or archives them, and sees where they went.
    permissions:
      - {entity: MediaAsset, read: true, write: true, create: true, export: true}
      - {entity: AssetCollection, read: true, write: true, create: true}
      - {entity: AssetUsage, read: true, write: true, create: true, export: true}
      - {entity: AssetShare, read: true, write: true, export: true}
  - name: Media Contributor
    description: Adds assets from Drive with their rights, submits them, and records where they are used.
    permissions:
      - {entity: MediaAsset, read: true, write: true, create: true}
      - {entity: AssetCollection, read: true}
      - {entity: AssetUsage, read: true, create: true}
      - {entity: AssetShare, read: true}
  - name: Media User
    description: Finds approved assets and records where they are used.
    permissions:
      - {entity: MediaAsset, read: true, where: {status: Approved}}
      - {entity: AssetCollection, read: true}
      - {entity: AssetUsage, read: true, create: true, if_owner: true}

# Personal-data requests reach the people Digital Assets names by address: who keeps a collection,
# approves an asset, uses one and shares one. Erasure takes the address off; the records stay.
personal_data:
  - {entity: AssetCollection, match: owner, erase: [owner]}
  - {entity: MediaAsset, match: approved_by, erase: [approved_by]}
  - {entity: AssetUsage, match: used_by, erase: [used_by]}
  - {entity: AssetShare, match: shared_by, erase: [shared_by]}
